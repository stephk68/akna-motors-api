name: CI/CD Backend - DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image API (DEV)
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Générer le tag de version unique
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "image_tag=dev-${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || 'kysaymeric' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Backend (DEV)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kysaymeric/akna-motors-api:dev
            kysaymeric/akna-motors-api:latest-dev
            kysaymeric/akna-motors-api:${{ steps.meta.outputs.image_tag }}
            kysaymeric/akna-motors-api:${{ github.sha }}

  deploy-vps:
    name: Déploiement VPS API (DEV)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Executer le redéploiement API sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          envs: API_IMAGE_TAG
          script: |
            set -e
            mkdir -p ~/akna-motors/api
            cd ~/akna-motors/api
            cat << 'EOF' > docker-compose.dev.yml
            version: '3.8'

            services:
              postgres-dev:
                image: postgres:${POSTGRES_VERSION:-16-alpine}
                container_name: akna-postgres-dev
                restart: always
                environment:
                  POSTGRES_USER: akna_dev
                  POSTGRES_PASSWORD: akna_dev_password_123
                  POSTGRES_DB: akna_dev_db
                ports:
                  - "127.0.0.1:5432:5432"
                volumes:
                  - postgres_dev_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U akna_dev -d akna_dev_db"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              api-dev:
                image: kysaymeric/akna-motors-api:${API_IMAGE_TAG:-dev}
                container_name: akna-api-dev
                restart: always
                depends_on:
                  postgres-dev:
                    condition: service_healthy
                ports:
                  - "127.0.0.1:3333:3333"
                # Secrets (JWT_SECRET, SMTP_USER, SMTP_PASS) : fichier present
                # uniquement sur le serveur, jamais versionne. Le script de
                # deploiement le cree vide s il manque pour ne pas casser compose.
                # Attention : les cles definies dans "environment" ci-dessous
                # priment sur celles du env_file.
                volumes:
                  - uploads_dev_data:/app/uploads
                env_file:
                  - .env.dev
                environment:
                  NODE_ENV: development
                  PORT: 3333
                  DATABASE_URL: postgresql://akna_dev:akna_dev_password_123@postgres-dev:5432/akna_dev_db?schema=public
                  CORS_ORIGINS: "*"
                  JWT_ACCESS_EXPIRATION: 15m
                  JWT_REFRESH_EXPIRATION: 30d
                  OCPP_DRIVER: mock
                  PAYMENT_DRIVER: mock
                  SMS_DRIVER: mock
                  OTP_EXPOSE_CODE: "true"
                  OTP_TTL_SECONDS: 300
                  UPLOAD_DEST: ./uploads
                  MAX_FILE_SIZE: 5242880
                  SWAGGER_ENABLED: "true"
                  SWAGGER_PATH: api/docs
                  SMTP_HOST: smtp.gmail.com
                  SMTP_PORT: 587
                  SMTP_SECURE: "false"
                  SMTP_FROM: '"AKNA Electric Mobility" <noreply@aknamotors.com>'

            volumes:
              postgres_dev_data:
              uploads_dev_data:
            EOF
            # Garde-fou : compose refuse de demarrer si le env_file est absent.
            # Sur un serveur neuf il faudra y remettre les vrais secrets.
            [ -f .env.dev ] || touch .env.dev
            chmod 600 .env.dev
            echo "Déploiement de l'image kysaymeric/akna-motors-api:${API_IMAGE_TAG}"
            docker compose -f docker-compose.dev.yml pull api-dev
            docker compose -f docker-compose.dev.yml up -d postgres-dev api-dev
            docker image prune -f
            docker compose -f docker-compose.dev.yml ps
