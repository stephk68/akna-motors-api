name: CI/CD Backend - RECETTE

on:
  push:
    branches:
      - main
      - staging
      - recette
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image API (RECETTE)
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Générer le tag de version unique
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "image_tag=rec-${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || 'kysaymeric' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Backend (RECETTE)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kysaymeric/akna-motors-api:recette
            kysaymeric/akna-motors-api:latest
            kysaymeric/akna-motors-api:${{ steps.meta.outputs.image_tag }}
            kysaymeric/akna-motors-api:${{ github.sha }}

  deploy-vps:
    name: Déploiement VPS API (RECETTE)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Executer le redéploiement API sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          envs: API_IMAGE_TAG
          script: |
            set -e
            mkdir -p ~/akna-motors/api
            cd ~/akna-motors/api
            cat << 'EOF' > docker-compose.recette.yml
            version: '3.8'

            services:
              postgres-recette:
                image: postgres:${POSTGRES_VERSION:-16-alpine}
                container_name: akna-postgres-recette
                restart: always
                environment:
                  POSTGRES_USER: akna_recette
                  POSTGRES_PASSWORD: akna_recette_password_987
                  POSTGRES_DB: akna_recette_db
                ports:
                  - "127.0.0.1:5433:5432"
                volumes:
                  - postgres_recette_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U akna_recette -d akna_recette_db"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              api-recette:
                image: kysaymeric/akna-motors-api:${API_IMAGE_TAG:-recette}
                container_name: akna-api-recette
                restart: always
                depends_on:
                  postgres-recette:
                    condition: service_healthy
                ports:
                  - "3334:3333"
                environment:
                  NODE_ENV: production
                  PORT: 3333
                  DATABASE_URL: postgresql://akna_recette:akna_recette_password_987@postgres-recette:5432/akna_recette_db?schema=public
                  JWT_SECRET: super_secret_jwt_akna_recette_key_2026_x89!
                  CORS_ORIGINS: "*"

            volumes:
              postgres_recette_data:
            EOF
            echo "Déploiement de l'image kysaymeric/akna-motors-api:${API_IMAGE_TAG}"
            docker compose -f docker-compose.recette.yml pull api-recette
            docker compose -f docker-compose.recette.yml up -d postgres-recette api-recette
            docker image prune -f
            docker compose -f docker-compose.recette.yml ps
