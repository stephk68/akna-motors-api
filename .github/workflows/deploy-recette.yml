name: CI/CD Backend - RECETTE

on:
  push:
    branches:
      - main
      - staging
      - recette
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image API (RECETTE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || 'kysaymeric' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Backend (RECETTE)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kysaymeric/akna-motors-api:recette
            kysaymeric/akna-motors-api:latest

  deploy-vps:
    name: Déploiement VPS API (RECETTE)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: "${{ secrets.VPS_HOST != '' }}"

    steps:
      - name: Executer le redéploiement API sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          script: |
            mkdir -p ~/akna-motors
            cd ~/akna-motors
            cat << 'EOF' > docker-compose.recette.yml
            version: '3.8'

            services:
              postgres-recette:
                image: postgres:16-alpine
                container_name: akna-postgres-recette
                restart: always
                environment:
                  POSTGRES_USER: akna_recette
                  POSTGRES_PASSWORD: akna_recette_password_987
                  POSTGRES_DB: akna_recette_db
                ports:
                  - "5433:5432"
                volumes:
                  - postgres_recette_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U akna_recette -d akna_recette_db"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              api-recette:
                image: kysaymeric/akna-motors-api:recette
                container_name: akna-api-recette
                restart: always
                depends_on:
                  postgres-recette:
                    condition: service_healthy
                ports:
                  - "3334:3333"
                environment:
                  NODE_ENV: production
                  PORT: 3333
                  DATABASE_URL: postgresql://akna_recette:akna_recette_password_987@postgres-recette:5432/akna_recette_db?schema=public
                  JWT_SECRET: super_secret_jwt_akna_recette_key_2026_x89!
                  CORS_ORIGINS: "*"

              front-recette:
                image: kysaymeric/akna-motors-front:recette
                container_name: akna-front-recette
                restart: always
                depends_on:
                  - api-recette
                ports:
                  - "3001:3000"
                environment:
                  NODE_ENV: production
                  PORT: 3000

            volumes:
              postgres_recette_data:
            EOF
            docker compose -f docker-compose.recette.yml pull api-recette
            docker compose -f docker-compose.recette.yml up -d api-recette postgres-recette
            docker image prune -f
