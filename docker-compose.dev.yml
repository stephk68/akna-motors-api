version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: akna-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: akna_dev
      POSTGRES_PASSWORD: akna_dev_password_123
      POSTGRES_DB: akna_dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akna_dev -d akna_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-dev:
    image: kysaymeric/akna-motors-api:dev
    container_name: akna-api-dev
    restart: always
    depends_on:
      postgres-dev:
        condition: service_healthy
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://akna_dev:akna_dev_password_123@postgres-dev:5432/akna_dev_db?schema=public
      JWT_SECRET: super_secret_jwt_akna_dev_key_2026!
      CORS_ORIGINS: "*"

volumes:
  postgres_dev_data:
