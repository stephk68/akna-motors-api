version: '3.8'

services:
  postgres-dev:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: akna-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: akna_dev
      POSTGRES_PASSWORD: akna_dev_password_123
      POSTGRES_DB: akna_dev_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akna_dev -d akna_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-dev:
    image: kysaymeric/akna-motors-api:${API_IMAGE_TAG:-dev}
    container_name: akna-api-dev
    restart: always
    depends_on:
      postgres-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:3333"
    # Secrets (JWT_SECRET, SMTP_USER, SMTP_PASS) : fichier local, non versionne.
    # Les cles definies dans "environment" ci-dessous priment sur le env_file.
    volumes:
      - uploads_dev_data:/app/uploads
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://akna_dev:akna_dev_password_123@postgres-dev:5432/akna_dev_db?schema=public
      CORS_ORIGINS: "*"
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
      OCPP_DRIVER: mock
      PAYMENT_DRIVER: mock
      SMS_DRIVER: mock
      OTP_EXPOSE_CODE: "true"
      OTP_TTL_SECONDS: 300
      UPLOAD_DEST: ./uploads
      MAX_FILE_SIZE: 5242880
      SWAGGER_ENABLED: "true"
      SWAGGER_PATH: api/docs
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_FROM: '"AKNA Electric Mobility" <noreply@aknamotors.com>'

volumes:
  postgres_dev_data:
  uploads_dev_data:
