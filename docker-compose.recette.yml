version: '3.8'

services:
  postgres-recette:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: akna-postgres-recette
    restart: always
    environment:
      POSTGRES_USER: akna_recette
      POSTGRES_PASSWORD: akna_recette_password_987
      POSTGRES_DB: akna_recette_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_recette_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akna_recette -d akna_recette_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-recette:
    image: kysaymeric/akna-motors-api:${API_IMAGE_TAG:-recette}
    container_name: akna-api-recette
    restart: always
    depends_on:
      postgres-recette:
        condition: service_healthy
    ports:
      - "3334:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://akna_recette:akna_recette_password_987@postgres-recette:5432/akna_recette_db?schema=public
      JWT_SECRET: super_secret_jwt_akna_recette_key_2026_x89!
      CORS_ORIGINS: "*"

volumes:
  postgres_recette_data:
